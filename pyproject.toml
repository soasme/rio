[project]
name = "rio"
version = "0.4.1"
description = "rio_ai: a ported multi-provider LLM streaming SDK. rio_agent: a SKILL.state long-horizon agent runtime (arXiv:2608.26263). rio_coding: a SKILL.state coding agent."
readme = "README.md"
authors = [
    { name = "Ju Lin", email = "soasme@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "anyio>=4.0",
    "httpx[socks]>=0.27",
    "packaging>=24.0",
    "pillow>=11.0",
    "pydantic>=2.11",
    "pygments>=2.18",
    "pyte>=0.8.2",
    "rich>=13.0",
    "textual>=8.2.8",
    "textual-diff-view>=0.1.5",
    "typer>=0.12",
]

[project.scripts]
rio = "rio_coding.cli:app"

[project.urls]
Repository = "https://github.com/soasme/rio"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rio_ai", "src/rio_agent", "src/rio_coding", "src/rio_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]
