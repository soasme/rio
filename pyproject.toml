[project]
name = "rio"
version = "0.9.2"
description = "A coding agent with durable SQLite state and a multi-provider LLM SDK."
readme = "README.md"
authors = [
    { name = "Ju Lin", email = "soasme@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "anyio>=4.0",
    "httpx[socks]>=0.27",
    "packaging>=24.0",
    "pillow>=11.0",
    "psutil>=7.0",
    "pydantic>=2.11",
]

[project.scripts]
rio = "rio.cli:main"

[project.urls]
Repository = "https://github.com/soasme/rio"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TID251"]
ignore = ["ANN401"]  # Dynamic JSON and forwarding keyword arguments may use Any.

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TypedDict".msg = "Use a Pydantic model for structured records."
"typing_extensions.TypedDict".msg = "Use a Pydantic model for structured records."

[tool.mypy]
files = ["src", "tests", "scripts", "evals"]
exclude = ["^evals/cases/"]  # Independent grading fixtures include deliberately broken code.
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "types-psutil>=7.2.2.20260906",
]
