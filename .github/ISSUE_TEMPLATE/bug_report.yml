name: Bug report
description: Report a reproducible rio bug.
title: "[Bug]: "
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
      placeholder: What did rio do, and what should it have done?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Share the smallest command, prompt, or sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: rio-version
    attributes:
      label: rio version
      description: Output of `rio --version`
      placeholder: rio 0.1.0
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: Python 3.12.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true

  - type: input
    id: provider-model
    attributes:
      label: Provider and model
      description: Include both the provider and model you were using.
      placeholder: openai / gpt-5
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Where did the problem happen?
      options:
        - CLI
        - TUI
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or failing tool call
      description: Paste any relevant logs, traceback, or the failing tool call.
      render: shell
